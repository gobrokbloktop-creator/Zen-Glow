<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zen Glow: Ultra Evolution</title>
    <style>
        :root {
            --bg: #030509;
            --accent: #00f2fe;
            --gold: #ffd700;
            --danger: #ff4757;
            --glass: rgba(255, 255, 255, 0.08);
            --font: 'Segoe UI', Roboto, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

        body { 
            background: var(--bg); color: white; font-family: var(--font); 
            overflow: hidden; height: 100vh; width: 100vw;
            display: flex; justify-content: center; 
        }

        #game-container {
            position: relative; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 10%, #1e3a5f 0%, #030509 100%);
            overflow: hidden;
        }

        #splash-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000; display: flex; justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }
        #splash-screen img {
            width: 250px; height: 250px; border-radius: 40px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.6);
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        canvas { display: block; width: 100%; height: 100%; }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(3, 5, 9, 0.98); backdrop-filter: blur(25px); 
            z-index: 600; padding: 20px; text-align: center;
        }

        .menu-group {
            display: flex; flex-direction: column; gap: 10px;
            width: 100%; max-width: 300px;
        }

        .currency-bar {
            display: flex; gap: 8px; background: var(--glass);
            padding: 5px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
        }

        #settings-btn {
            position: absolute; top: 55px; right: 20px; width: 44px; height: 44px;
            border-radius: 50%; background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
            color: white; z-index: 700; display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            cursor: pointer;
        }
        .hidden { display: none !important; opacity: 0; pointer-events: none; }

        h1 { font-size: 3rem; font-weight: 900; background: linear-gradient(to bottom, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(0,242,254,0.3)); }

        .shop-container, .mission-container { width: 90%; max-height: 50vh; overflow-y: auto; padding: 15px; display: grid; gap: 15px; }
        .shop-container { grid-template-columns: 1fr 1fr; }
        .mission-container { grid-template-columns: 1fr; }

        .shop-item, .mission-item {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 15px; border-radius: 20px;
            text-align: center; transition: 0.3s;
        }
        .mission-item { text-align: left; display: flex; justify-content: space-between; align-items: center; min-height: 80px; }
        .shop-item.active { border-color: var(--accent); background: rgba(0,242,254,0.1); box-shadow: 0 0 20px rgba(0,242,254,0.2); }
        .skin-circle { width: 35px; height: 35px; border-radius: 50%; margin: 0 auto 10px; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        .legendary-border {
            border: 1px solid var(--gold) !important;
            background: linear-gradient(145deg, rgba(255,215,0,0.1), rgba(0,0,0,0.5)) !important;
            animation: goldGlow 3s infinite alternate;
        }
        @keyframes goldGlow {
            from { box-shadow: 0 0 5px rgba(255,215,0,0.2); }
            to { box-shadow: 0 0 15px rgba(255,215,0,0.4); }
        }
        .eternal-border {
            border: 2px solid #fff !important;
            background: linear-gradient(145deg, rgba(255,255,255,0.3), rgba(0,0,0,0.9)) !important;
            animation: eternalGlow 1.5s infinite alternate;
        }
        @keyframes eternalGlow {
            0% { box-shadow: 0 0 15px #fff, inset 0 0 10px var(--accent); }
            100% { box-shadow: 0 0 25px #ff00de, inset 0 0 20px #fff; }
        }

        #hud { position: absolute; top: 110px; left: 0; width: 100%; padding: 0 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .hud-card { background: var(--glass); padding: 8px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); backdrop-filter: blur(10px); }
        .label { font-size: 8px; text-transform: uppercase; opacity: 0.6; display: block; }
        .val { font-size: 1.3rem; font-weight: 800; font-family: monospace; }

        #pause-btn {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
            color: white; z-index: 350; display: flex; align-items: center; justify-content: center; font-weight: bold;
            cursor: pointer;
        }

        .btn { padding: 14px 25px; font-size: 0.85rem; font-weight: bold; border-radius: 15px; border: none; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; width: 100%; }
        .btn-primary { background: var(--accent); color: #000; box-shadow: 0 8px 20px rgba(0,242,254,0.4); }
        .btn-secondary { background: var(--glass); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .btn-mode { width: 100%; height: auto; padding: 12px; text-align: left; background: rgba(0,0,0,0.5); }
        .mode-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .mode-title { font-size: 1rem; font-weight: bold; }
        .mode-stats { font-size: 10px; font-family: monospace; opacity: 0.8; }
        .mode-desc { font-size: 0.7rem; color: #aaa; text-transform: none; font-weight: normal; line-height: 1.2; }
        .btn-claim { background: var(--gold); color: #000; width: auto; padding: 8px 15px; font-size: 0.7rem; border-radius: 10px; min-width: 80px; }
        .btn-claimed { background: #444; color: #888; cursor: default; }

        #progress-bar { position: absolute; bottom: 0; left: 0; height: 8px; background: var(--accent); width: 100%; box-shadow: 0 -4px 15px var(--accent); z-index: 50; }
        #level-up-text { position: absolute; top: 30%; width: 100%; text-align: center; font-size: 2rem; font-weight: 900; color: var(--accent); pointer-events: none; opacity: 0; transition: 0.5s; z-index: 100; }
        #reset-text { position: absolute; top: 35%; width: 100%; text-align: center; font-size: 1.5rem; font-weight: 900; color: var(--danger); pointer-events: none; opacity: 0; transition: 0.5s; z-index: 100; }
        #slowmo-indicator { position: absolute; top: 110px; width: 100%; text-align: center; color: var(--gold); font-size: 12px; font-weight: bold; opacity: 0; z-index: 100; }
        .stat-value { font-size: 3rem; font-weight: 900; color: var(--accent); display: block; margin: 10px 0; }
        #transition-layer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none; display: flex; flex-direction: column; }
        .portal-bar { width: 100%; height: 50%; background: #030509; position: absolute; left: 0; transition: none; opacity: 0; display: flex; align-items: center; justify-content: center; }
        .bar-top { top: 0; transform: translateY(-100%); border-bottom: 2px solid var(--accent); box-shadow: 0 5px 20px rgba(0, 242, 254, 0.3); }
        .bar-bottom { bottom: 0; transform: translateY(100%); border-top: 2px solid var(--accent); box-shadow: 0 -5px 20px rgba(0, 242, 254, 0.3); }
        @keyframes portalIn { 0% { transform: translateY(var(--start)); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        @keyframes portalOut { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(var(--start)); opacity: 0; } }
        .animate-in { animation: portalIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .animate-out { animation: portalOut 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        .glitch-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--accent); opacity: 0; z-index: 9998; pointer-events: none; }
        @keyframes startFlash { 0% { opacity: 0.8; transform: scaleY(0); } 50% { opacity: 0.4; transform: scaleY(1); } 100% { opacity: 0; transform: scaleY(0); } }
        .animate-start { animation: startFlash 0.4s ease-out forwards; }
        .pause-scanline { position: absolute; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; pointer-events: none; z-index: 550; }
        #dev-badge { position: absolute; bottom: 10px; right: 10px; font-size: 10px; color: var(--gold); font-family: monospace; opacity: 0.5; z-index: 1000; pointer-events: none; }
        #resource-display { position: absolute; top: 15px; left: 15px; display: flex; gap: 12px; background: rgba(0,0,0,0.5); padding: 5px 12px; border-radius: 20px; backdrop-filter: blur(5px); z-index: 20; font-weight: bold; font-size: 14px; pointer-events: none; }
        #resource-display span { margin-left: 4px; }
        #wheel-pointer { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 15px solid transparent; border-right: 15px solid transparent; border-top: 25px solid var(--gold); z-index: 10; }
        #wheel-canvas { transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }

        #result-screen {
            background: rgba(0, 0, 0, 0.95);
            border: 2px solid var(--accent);
            border-radius: 30px;
            width: 280px;
            padding: 30px;
            box-shadow: 0 0 50px rgba(0, 242, 254, 0.4);
            text-align: center;
        }
        .reward-anim {
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold);
            display: block;
            margin: 20px 0;
            animation: zoomIn 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.49);
        }
        @keyframes zoomIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .error-popup {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 71, 87, 0.95); padding: 20px; border-radius: 15px;
            border: 2px solid #fff; z-index: 2000; text-align: center;
            animation: shake 0.4s ease-in-out;
            width: 260px;
        }
        @keyframes shake {
            0%, 100% { transform: translate(-50%, -50%) rotate(0); }
            25% { transform: translate(-52%, -50%) rotate(-2deg); }
            75% { transform: translate(-48%, -50%) rotate(2deg); }
        }

        .mission-report-box {
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid var(--danger);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.2);
            width: 90%;
            max-width: 350px;
        }

        .report-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .report-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 10px;
            border-left: 3px solid var(--accent);
        }

        .val-small { font-size: 1.1rem; font-weight: bold; font-family: monospace; display: block; }

        .main-score-area {
            margin: 20px 0;
            padding: 15px;
            background: linear-gradient(to right, transparent, rgba(0, 242, 254, 0.1), transparent);
        }

        .rewards-area {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .reward-pill {
            background: #111;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .report-item, .main-score-area, .reward-pill, #game-over-menu .btn {
            opacity: 0;
            transform: translateY(20px);
        }

        .animate-report {
            animation: slideUp 0.5s ease forwards;
        }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .confirm-reset {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #111; border: 2px solid var(--danger); border-radius: 20px;
            padding: 20px; z-index: 2500; text-align: center; width: 260px;
            box-shadow: 0 0 40px rgba(255,71,87,0.5);
        }
        .confirm-reset button { margin: 10px; width: auto; padding: 8px 20px; }
    </style>
</head>
<body>
<div id="transition-layer">
    <div class="portal-bar bar-top" id="z-top" style="--start: -100%"></div>
    <div class="portal-bar bar-bottom" id="z-bottom" style="--start: 100%"></div>
</div>

<div id="game-container">
    <div id="splash-screen"><img src="logo.png" alt="Logo"></div>
    <div id="level-up-text">LEVEL UP!</div>
    <div id="reset-text">LEVEL RESET!</div>
    <div id="slowmo-indicator">SLOW MOTION ACTIVE</div>
    
    <div id="resource-display">
        <span style="color: var(--gold);">✨ <span id="game-dust">0</span></span>
        <span style="color: #f093fb;">💠 <span id="game-shard">0</span></span>
    </div>
    
    <button id="settings-btn" onclick="openSettings()">⚙️</button>
    <div id="fx-layer" class="glitch-overlay"></div>
    <div id="dev-badge" class="hidden">DEV MODE: ACTIVE</div>

    <div id="error-overlay" class="overlay hidden" style="background: rgba(0,0,0,0.7); z-index: 1500;">
        <div class="error-popup">
            <h3 style="margin-bottom: 10px;">CORE ERROR</h3>
            <p id="error-message">Insufficient Shards!</p>
            <button class="btn btn-secondary" onclick="document.getElementById('error-overlay').classList.add('hidden')" style="margin-top: 15px; background: #fff; color: #000;">CLOSE</button>
        </div>
    </div>

    <div id="settings-menu" class="overlay hidden" style="z-index: 2000;">
        <h2 style="margin-bottom: 30px;">SETTINGS</h2>
        <div style="width: 80%; background: var(--glass); padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 20px;">
            <div><div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>Music Volume</span><span id="music-vol-label">100%</span></div>
            <input type="range" min="0" max="1" step="0.1" value="1" id="music-range" oninput="updateVolume('music')" style="width: 100%; accent-color: var(--accent);"></div>
            <div><div style="display: flex; justify-content: space-between; margin-bottom: 10px;"><span>SFX Volume</span><span id="sfx-vol-label">100%</span></div>
            <input type="range" min="0" max="1" step="0.1" value="1" id="sfx-range" oninput="updateVolume('sfx')" style="width: 100%; accent-color: var(--gold);"></div>
            <button class="btn btn-secondary" style="border-color: var(--danger); color: var(--danger); margin-top: 10px;" onclick="showResetConfirm()">⚠️ RESET DATA ⚠️</button>
        </div>
        <button class="btn btn-secondary" onclick="closeSettings()" style="margin-top: 30px;">Close</button>
    </div>

    <div id="reset-confirm" class="hidden" style="position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; justify-content: center; align-items: center;">
        <div class="confirm-reset">
            <h3 style="color: var(--danger);">RESET ALL DATA?</h3>
            <p style="margin: 15px 0;">Dust, Shards, Skins, High Scores, Missions akan kembali ke awal.</p>
            <div style="display: flex; gap: 10px; justify-content: center;">
                <button class="btn btn-primary" style="background: var(--danger); color: #fff;" onclick="resetAllData()">YES, RESET</button>
                <button class="btn btn-secondary" onclick="closeResetConfirm()">CANCEL</button>
            </div>
        </div>
    </div>

    <div id="main-menu" class="overlay">
        <h1 style="font-size: 2.5rem;">ZEN GLOW</h1>
        <div class="currency-bar" style="margin-bottom: 25px;">
            <span style="color: var(--gold);">✨ <span id="dust-display">0</span></span>
            <span style="color: #f093fb;">💠 <span id="shard-count-main">0</span></span>
        </div>
        <div class="menu-group">
            <button class="btn btn-primary" onclick="toggleOverlay('main-menu', false); toggleOverlay('mode-selection', true);">Launch Nexus</button>
            <button class="btn btn-secondary" style="border-color: var(--gold); color: var(--gold);" onclick="toggleOverlay('main-menu', false); openWheel();">Singularity Wheel</button>
            <button class="btn btn-secondary" onclick="toggleOverlay('mission-menu', true)">Missions</button>
            <button class="btn btn-secondary" onclick="toggleOverlay('shop-menu', true)">Evolution</button>
            <button class="btn btn-secondary" style="font-size: 10px; opacity: 0.7;" onclick="toggleOverlay('help-menu', true)">How to Play</button>
        </div>
        <p style="margin-top: 20px; font-size: 10px; opacity: 0.4;">GLOBAL BEST: <span id="best-display">0</span></p>
    </div>

    <div id="mode-selection" class="overlay hidden">
        <h2 style="margin-bottom: 20px;">SELECT SECTOR</h2>
        <div class="menu-group" style="max-height: 70vh; overflow-y: auto; padding-right: 5px;">
            <p style="font-size: 10px; color: var(--accent); margin-bottom: 5px;">CORE MODES</p>
            <button class="btn btn-secondary btn-mode" onclick="startGame('original')">
                <div class="mode-header"><span class="mode-title">ARAH</span><span id="best-original" class="mode-stats">HS: 0 | LV: 1</span></div>
                <div class="mode-desc">Tembak target secara langsung. Klasik & Cepat.</div>
            </button>
            <button class="btn btn-secondary btn-mode" onclick="startGame('pantul')" style="border-color: var(--gold); color: var(--gold);">
                <div class="mode-header"><span class="mode-title">PANTUL</span><span id="best-pantul" class="mode-stats">HS: 0 | LV: 1</span></div>
                <div class="mode-desc">Wajib memantul ke dinding. Kena langsung = Kalah!</div>
            </button>
            <button class="btn btn-secondary btn-mode" onclick="startGame('orbit')" style="border-color: #f093fb; color: #f093fb;">
                <div class="mode-header"><span class="mode-title">ORBIT</span><span id="best-orbit" class="mode-stats">HS: 0 | LV: 1</span></div>
                <div class="mode-desc">Target bergerak melingkar! Gunakan lengkungan untuk menyerang.</div>
            </button>
            
            <p style="font-size: 10px; color: #f093fb; margin-top: 15px; margin-bottom: 5px;">ARMADA
